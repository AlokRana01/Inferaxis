[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferaxis-backend"
version = "0.1.0"
description = "Inferaxis - Autonomous AI for Evidence-Based Data Intelligence Backend Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Inferaxis Core Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.33.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "alembic>=1.13.1,<2.0.0",
    "asyncpg>=0.29.0,<0.31.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "redis>=5.0.4,<6.0.0",
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "python-multipart>=0.0.9",
    "chardet>=5.2.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
